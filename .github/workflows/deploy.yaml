on:
  push:
    branches:
      - feature/*

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
        
      - name: Verificar estrutura do repositório
        run: ls -R
      
      - name: Build Lambda
        run: |
          dotnet restore src/Lambda/LambdaStatus.csproj
          dotnet publish src/Lambda/LambdaStatus.csproj -c Release -o terraform/publish
          cd publish
          zip -r ../lambda.zip .
          ls -lh ../lambda.zip
          unzip -l ../lambda.zip
      
      - name: Verificar estrutura do repositório
        run: ls -R

      - name: Move Lambda package to Terraform directory
        run: mv lambda.zip terraform/

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Apply Terraform
        run: terraform apply -auto-approve
        working-directory: terraform

